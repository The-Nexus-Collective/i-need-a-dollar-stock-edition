# ═══════════════════════════════════════════════════════════════════════════════
# SIMPLIFIED ARCHITECTURE: 3 Containers
# - PostgreSQL (Database)
# - Backend (Bot + API in one process)
# - Frontend (Next.js Dashboard)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════════════════
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: trading_db
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/migrations/002_add_filter_columns.sql:/docker-entrypoint-initdb.d/02_filters.sql:ro
      - ./backend/migrations/003_account_state.sql:/docker-entrypoint-initdb.d/03_account.sql:ro
      - ./backend/migrations/004_leverage_and_paper_mode.sql:/docker-entrypoint-initdb.d/04_leverage.sql:ro
      - ./backend/migrations/005_multi_asset.sql:/docker-entrypoint-initdb.d/05_multi_asset.sql:ro
      - ./backend/migrations/006_velocity_metrics.sql:/docker-entrypoint-initdb.d/06_velocity.sql:ro
      - ./backend/migrations/007_agentic_system.sql:/docker-entrypoint-initdb.d/07_agentic.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND (Bot + API combined)
  # ═══════════════════════════════════════════════════════════════════════════

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_backend
    environment:
      - DATABASE_URL=postgresql://trading_user:${DB_PASSWORD:-trading_secret_2024}@postgres:5432/trading_platform
      - XAI_API_KEY=${XAI_API_KEY}
      - MODE=${MODE:-paper}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-65}
      - VOLUME_FILTER_RATIO=${VOLUME_FILTER_RATIO:-0.80}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.02}
      - INITIAL_EQUITY=${INITIAL_EQUITY:-10000}
      - FLATTEN_TIME_CET=${FLATTEN_TIME_CET:-23:55}
      - CYCLE_MINUTES=${CYCLE_MINUTES:-15}
      - FORCE_TRADE=${FORCE_TRADE:-false}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CORS_ALLOW_ALL=true
      # Binance API (optional, for live trading)
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python main.py
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js Dashboard)
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MONITORING (Optional - activate with: docker compose --profile monitoring up)
  # ═══════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: trading_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: trading_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: trading_network
