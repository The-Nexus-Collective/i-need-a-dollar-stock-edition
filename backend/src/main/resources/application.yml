spring:
  application:
    name: i-need-a-dollar-stock-edition

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/trading_stock}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${API_PORT:8081}
  tomcat:
    connection-timeout: 60s
  servlet:
    session:
      timeout: 30m

# Application Configuration
trading:
  mode: ${MODE:paper}
  cycle:
    interval: ${CYCLE_INTERVAL:600000}  # 10 minutes in milliseconds
  # Position sizing and count are determined dynamically by Grok AI
  deployment:
    min-ratio: ${MIN_DEPLOYMENT_RATIO:0.75}
    max-ratio: ${MAX_DEPLOYMENT_RATIO:1.00}
  capital:
    starting: ${STARTING_CAPITAL:1000000}

# Stock Universe Configuration
stocks:
  data-provider: yahoo-finance
  market-timezone: America/New_York
  trading-hours:
    open: "09:30"
    close: "16:00"
    allow-premarket: false
    allow-afterhours: false
  universe:
    # High-liquidity Tech Stocks
    tech:
      - AAPL   # Apple
      - MSFT   # Microsoft
      - GOOGL  # Alphabet
      - AMZN   # Amazon
      - META   # Meta Platforms
      - NVDA   # NVIDIA
      - TSLA   # Tesla
      - AMD    # AMD
      - INTC   # Intel
      - CRM    # Salesforce
      - ORCL   # Oracle
      - ADBE   # Adobe
      - CSCO   # Cisco
      - IBM    # IBM
      - QCOM   # Qualcomm
      - AVGO   # Broadcom
      - TXN    # Texas Instruments
      - MU     # Micron
      - AMAT   # Applied Materials
      - LRCX   # Lam Research
    # Defense/Aerospace Stocks
    defense:
      - LMT    # Lockheed Martin
      - RTX    # Raytheon Technologies
      - NOC    # Northrop Grumman
      - GD     # General Dynamics
      - BA     # Boeing
      - LHX    # L3Harris Technologies
      - HII    # Huntington Ingalls
      - TDG    # TransDigm
      - LDOS   # Leidos
  min-volume: 1000000  # Minimum daily volume

# Polygon.io API Configuration (for reliable market hours detection)
polygon:
  api-key: ${POLYGON_API_KEY:}
  enabled: ${POLYGON_ENABLED:true}
  cache-seconds: 60  # Cache API response for 60 seconds

# Grok AI (xAI) Configuration
xai:
  api-key: ${XAI_API_KEY:}
  base-url: https://api.x.ai/v1
  model: ${XAI_MODEL:grok-4-1-fast-reasoning}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3100,http://127.0.0.1:3100}
  allow-all: ${CORS_ALLOW_ALL:false}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Logging
logging:
  level:
    root: INFO
    com.inad.stocks: DEBUG
    org.springframework.web.socket: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} | %-5level | %logger{36} | %msg%n"

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
