# ═══════════════════════════════════════════════════════════════════════════════
# Digital Ocean App Platform Specification
# I-Need-A-Dollar Trading Platform
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deploy: doctl apps create --spec .do/app.yaml
# Update: doctl apps update <app-id> --spec .do/app.yaml
#
# Before deploying, create these managed databases in DO:
# 1. PostgreSQL cluster (attach as 'db')
# 2. Redis cluster (attach as 'redis')
# ═══════════════════════════════════════════════════════════════════════════════

name: i-need-a-dollar

region: fra  # Frankfurt - change to your preferred region (nyc, sfo, ams, sgp, etc.)

# ─── GLOBAL ENVIRONMENT VARIABLES ──────────────────────────────────────────────
# AGGRESSIVE MODE CONFIGURATION
envs:
  - key: MODE
    value: "paper"
    scope: RUN_AND_BUILD_TIME
  - key: XAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: REDIS_URL
    scope: RUN_TIME
    type: SECRET
  # Aggressive strategy parameters
  - key: CYCLE_MINUTES
    value: "15"
  - key: SCORE_THRESHOLD
    value: "50"
  - key: VOLUME_FILTER_RATIO
    value: "0.70"
  - key: RISK_PER_TRADE
    value: "0.02"
  - key: RISK_PER_REBALANCE
    value: "0.015"
  - key: REBALANCE_THRESHOLD
    value: "0.15"
  - key: MIN_COINS_PER_CYCLE
    value: "5"
  - key: MAX_COINS_PER_CYCLE
    value: "8"
  - key: TARGET_DEPLOYMENT
    value: "0.80"
  - key: MIN_LEVERAGE
    value: "4.0"
  - key: MAX_LEVERAGE
    value: "7.0"
  - key: MAX_DEPLOYED
    value: "0.90"
  - key: PER_ASSET_LIMIT
    value: "0.20"
  - key: DAILY_LOSS_LIMIT
    value: "0.06"
  - key: INITIAL_EQUITY
    value: "100000"
  - key: FLATTEN_TIME_CET
    value: "23:55"
  - key: FORCE_TRADE
    value: "false"

# ─── SERVICES ──────────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # GATEWAY API (FastAPI)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: gateway
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_size_slug: basic-xxs  # $5/mo - upgrade as needed
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: CORS_ALLOW_ALL
        scope: RUN_TIME
        value: "true"
    routes:
      - path: /api
      - path: /ws
      - path: /docs
      - path: /health
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: frontend
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}/api
      - key: NEXT_PUBLIC_WS_URL
        scope: RUN_AND_BUILD_TIME
        value: wss://${APP_DOMAIN}/ws

# ─── WORKERS (Background Services) ─────────────────────────────────────────────

workers:
  # ═══════════════════════════════════════════════════════════════════════════
  # TRADING BOT
  # ═══════════════════════════════════════════════════════════════════════════
  - name: bot
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: python bot.py
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

  # ═══════════════════════════════════════════════════════════════════════════
  # SIGNAL ENGINE
  # ═══════════════════════════════════════════════════════════════════════════
  - name: signal-engine
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: python -m core.signal_engine
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

  # ═══════════════════════════════════════════════════════════════════════════
  # RISK MANAGER
  # ═══════════════════════════════════════════════════════════════════════════
  - name: risk-manager
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: python -m core.risk_manager
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

# ─── DATABASES ─────────────────────────────────────────────────────────────────
# References existing managed PostgreSQL cluster

databases:
  - name: db
    engine: PG
    cluster_name: i-need-a-dollar
    production: true

# ─── JOBS (Pre-deploy tasks) ──────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE MIGRATIONS
  # Runs before services start on each deployment
  # Tracks applied migrations in schema_migrations table
  # ═══════════════════════════════════════════════════════════════════════════
  - name: migrate
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: basic-xxs
    kind: PRE_DEPLOY
    run_command: python migrations/run_migrations.py
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}

