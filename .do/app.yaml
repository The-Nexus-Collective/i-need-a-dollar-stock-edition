# ═══════════════════════════════════════════════════════════════════════════════
# Digital Ocean App Platform Specification
# I-Need-A-Dollar Trading Platform
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deploy: doctl apps create --spec .do/app.yaml
# Update: doctl apps update <app-id> --spec .do/app.yaml
#
# Before deploying, create these managed databases in DO:
# 1. PostgreSQL cluster (attach as 'db')
# 2. Redis cluster (attach as 'redis')
# ═══════════════════════════════════════════════════════════════════════════════

name: i-need-a-dollar

region: fra  # Frankfurt - change to your preferred region (nyc, sfo, ams, sgp, etc.)

# ─── GLOBAL ENVIRONMENT VARIABLES ──────────────────────────────────────────────
envs:
  - key: MODE
    value: "paper"
    scope: RUN_AND_BUILD_TIME
  - key: XAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: SCORE_THRESHOLD
    value: "65"
  - key: VOLUME_FILTER_RATIO
    value: "0.80"
  - key: RISK_PER_TRADE
    value: "0.02"
  - key: INITIAL_EQUITY
    value: "10000"
  - key: FLATTEN_TIME_CET
    value: "23:55"

# ─── SERVICES ──────────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # GATEWAY API (FastAPI)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: gateway
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: /backend
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_size_slug: basic-xxs  # $5/mo - upgrade as needed
    instance_count: 1
    routes:
      - path: /api
      - path: /ws
      - path: /docs
      - path: /health
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: frontend
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: /frontend
    dockerfile_path: Dockerfile
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}/api
      - key: NEXT_PUBLIC_WS_URL
        scope: RUN_AND_BUILD_TIME
        value: wss://${APP_DOMAIN}/ws

# ─── WORKERS (Background Services) ─────────────────────────────────────────────

workers:
  # ═══════════════════════════════════════════════════════════════════════════
  # TRADING BOT
  # ═══════════════════════════════════════════════════════════════════════════
  - name: bot
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: /backend
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: python bot.py
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}

  # ═══════════════════════════════════════════════════════════════════════════
  # SIGNAL ENGINE
  # ═══════════════════════════════════════════════════════════════════════════
  - name: signal-engine
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: /backend
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: python -m core.signal_engine
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}

  # ═══════════════════════════════════════════════════════════════════════════
  # RISK MANAGER
  # ═══════════════════════════════════════════════════════════════════════════
  - name: risk-manager
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: /backend
    dockerfile_path: Dockerfile
    instance_size_slug: basic-xxs
    instance_count: 1
    run_command: python -m core.risk_manager
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${redis.DATABASE_URL}

# ─── DATABASES ─────────────────────────────────────────────────────────────────
# These reference managed databases you create separately in DO
# After creating them, attach them to this app

databases:
  - name: db
    engine: PG
    production: false  # Set to true for production (enables backups, HA)
    cluster_name: i-need-a-dollar-db
    db_name: trading_platform
    db_user: trading_user
    version: "15"

  - name: redis
    engine: REDIS
    production: false
    cluster_name: i-need-a-dollar-redis
    version: "7"

