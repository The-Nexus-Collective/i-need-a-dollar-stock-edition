name: i-need-a-dollar-stock-edition
region: fra
features:
  - buildpack-stack=ubuntu-22

databases:
  - name: db
    engine: PG
    version: "15"
    size: db-s-dev-database
    num_nodes: 1

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    github:
      repo: The-Nexus-Collective/i-need-a-dollar-stock-edition
      branch: main
      deploy_on_push: false
    http_port: 8080
    instance_count: 1
    instance_size_slug: professional-xs
    routes:
      - path: /api
      - path: /ws/equity
      - path: /ws/live
      - path: /ws
      - path: /actuator
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.JDBC_DATABASE_URL}
      - key: DB_USERNAME
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      - key: MODE
        scope: RUN_TIME
        value: paper
      - key: XAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BINANCE_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BINANCE_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: POLYGON_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CYCLE_INTERVAL
        scope: RUN_TIME
        value: "600000"
      - key: STARTING_CAPITAL
        scope: RUN_TIME
        value: "1000000"
      - key: POSITION_SIZE_PCT
        scope: RUN_TIME
        value: "0.02"
      - key: MAX_POSITIONS
        scope: RUN_TIME
        value: "50"
      - key: MIN_DEPLOYMENT_RATIO
        scope: RUN_TIME
        value: "0.75"
      - key: MAX_DEPLOYMENT_RATIO
        scope: RUN_TIME
        value: "0.90"
      - key: API_PORT
        scope: RUN_TIME
        value: "8080"
      - key: CORS_ALLOW_ALL
        scope: RUN_TIME
        value: "true"
      - key: SPRING_PROFILES_ACTIVE
        scope: RUN_TIME
        value: docker

  - name: frontend
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    github:
      repo: The-Nexus-Collective/i-need-a-dollar-stock-edition
      branch: main
      deploy_on_push: false
    http_port: 3000
    instance_count: 1
    instance_size_slug: professional-xs
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${APP_URL}/api
      - key: NEXT_PUBLIC_WS_URL
        scope: BUILD_TIME
        value: wss://${APP_DOMAIN}/ws/equity
