# ═══════════════════════════════════════════════════════════════════════════════
# DigitalOcean App Platform Specification
# 
# Deploy: doctl apps update 7b3ab484-11e4-4466-a04a-3318a8110fbc --spec .do/app.yaml
# ═══════════════════════════════════════════════════════════════════════════════

name: i-need-a-dollar-stock-edition
region: fra

features:
  - buildpack-stack=ubuntu-22

ingress:
  rules:
    - component:
        name: frontend
      match:
        path:
          prefix: /
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /ws
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /actuator
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /health

databases:
  - engine: PG
    name: db
    version: "15"

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND SERVICE - Spring Boot
  # ═══════════════════════════════════════════════════════════════════════════
  - name: backend
    github:
      branch: main
      repo: The-Nexus-Collective/i-need-a-dollar-stock-edition
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_size_slug: professional-xs
    instance_count: 1
    
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.JDBC_DATABASE_URL}
      - key: DB_USERNAME
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      - key: MODE
        scope: RUN_TIME
        value: paper
      - key: XAI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:73+mSZRqT3aQon7BNCofW4VikBxj4J1b:lGK1QfAqg6nVQ/qtG/zAQw==]
      - key: BINANCE_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:ZRPsm2uSlFeaGzH7JxYNmUgKqUVl/wNv:69kD16yBd61rSWeDexqzsQ==]
      - key: BINANCE_API_SECRET
        scope: RUN_TIME
        type: SECRET
        value: EV[1:zuNZBenaUpVQ9NYSL81DTS5rtghAvfYX:+mFycSANAPd4e8uC9u0yBA==]
      - key: POLYGON_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:DsQ5bTLTBba1EBQkyyrzRu1ckqhCFRcq:9lzMXyxqBRGCNGV8hpsm/Q==]
      - key: CYCLE_INTERVAL
        scope: RUN_TIME
        value: "600000"
      - key: STARTING_CAPITAL
        scope: RUN_TIME
        value: "1000000"
      # Position sizing and count are determined dynamically by Grok AI
      - key: MIN_DEPLOYMENT_RATIO
        scope: RUN_TIME
        value: "0.75"
      - key: MAX_DEPLOYMENT_RATIO
        scope: RUN_TIME
        value: "1.00"
      - key: API_PORT
        scope: RUN_TIME
        value: "8080"
      - key: CORS_ALLOW_ALL
        scope: RUN_TIME
        value: "true"
      - key: SPRING_PROFILES_ACTIVE
        scope: RUN_TIME
        value: docker

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND SERVICE - Next.js
  # ═══════════════════════════════════════════════════════════════════════════
  - name: frontend
    github:
      branch: main
      repo: The-Nexus-Collective/i-need-a-dollar-stock-edition
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 3000
    instance_size_slug: professional-xs
    instance_count: 1
    
    envs:
      # API_URL should NOT include /api - the code already adds it
      - key: NEXT_PUBLIC_API_URL
        scope: BUILD_TIME
        value: ${APP_URL}
      - key: NEXT_PUBLIC_WS_URL
        scope: BUILD_TIME
        value: wss://${APP_DOMAIN}/ws/equity
