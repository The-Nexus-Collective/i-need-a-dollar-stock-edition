# ═══════════════════════════════════════════════════════════════════════════════
# Digital Ocean App Platform Specification
# I-Need-A-Dollar Trading Platform
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deploy: doctl apps create --spec .do/app.yaml
# Update: doctl apps update <app-id> --spec .do/app.yaml
# ═══════════════════════════════════════════════════════════════════════════════

name: i-need-a-dollar-crypto-edition
region: fra

# ─── SERVICES ─────────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND - Java/Spring Boot API
  # Liquibase handles database migrations automatically on startup
  # ═══════════════════════════════════════════════════════════════════════════
  - name: api
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8080
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /api
        preserve_path_prefix: true
      - path: /health
        preserve_path_prefix: true
      - path: /ws
        preserve_path_prefix: true
      - path: /docs
        preserve_path_prefix: true
    envs:
      # Spring profile for Docker/production
      - key: SPRING_PROFILES_ACTIVE
        scope: RUN_TIME
        value: docker
      # Database connection (Digital Ocean managed PostgreSQL)
      - key: SPRING_DATASOURCE_URL
        scope: RUN_TIME
        value: jdbc:postgresql://${db.HOSTNAME}:${db.PORT}/${db.DATABASE}?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: SPRING_DATASOURCE_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      # Trading configuration
      - key: MODE
        scope: RUN_TIME
        value: paper
      - key: TRADING_CAPITAL_STARTING
        scope: RUN_TIME
        value: "100000"
      - key: TRADING_POSITION_MAX_POSITIONS
        scope: RUN_TIME
        value: "50"
      - key: TRADING_POSITION_SIZE_PERCENT
        scope: RUN_TIME
        value: "0.02"
      # CORS
      - key: CORS_ALLOW_ALL
        scope: RUN_TIME
        value: "true"
      # Note: XAI_API_KEY is set at app-level and automatically inherited
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND - Next.js
  # ═══════════════════════════════════════════════════════════════════════════
  - name: frontend
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}
      - key: NEXT_PUBLIC_WS_URL
        scope: RUN_AND_BUILD_TIME
        value: wss://${APP_DOMAIN}/ws

# ─── DATABASES ────────────────────────────────────────────────────────────────

databases:
  - name: db
    engine: PG
    cluster_name: i-need-a-dollar-crypto-edition-db
    production: true

