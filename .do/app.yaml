# ═══════════════════════════════════════════════════════════════════════════════
# Digital Ocean App Platform Specification
# I-Need-A-Dollar Trading Platform
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deploy: doctl apps create --spec .do/app.yaml
# Update: doctl apps update <app-id> --spec .do/app.yaml
#
# Before deploying, create these managed databases in DO:
# 1. PostgreSQL cluster (attach as 'db')
# 2. Redis cluster (attach as 'redis')
# ═══════════════════════════════════════════════════════════════════════════════

name: i-need-a-dollar

region: fra  # Frankfurt - change to your preferred region (nyc, sfo, ams, sgp, etc.)

# ─── GLOBAL ENVIRONMENT VARIABLES ──────────────────────────────────────────────
# AGGRESSIVE MODE CONFIGURATION
envs:
  - key: MODE
    value: "paper"
    scope: RUN_AND_BUILD_TIME
  - key: XAI_API_KEY
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: JWT_SECRET
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: REDIS_URL
    scope: RUN_TIME
    type: SECRET
  # Trading configuration
  - key: CYCLE_INTERVAL
    value: "720"
  - key: TOP_COINS
    value: "100"
  - key: MAX_POSITIONS
    value: "50"
  - key: POSITION_SIZE_PCT
    value: "0.02"
  - key: STARTING_CAPITAL
    value: "100000"
  - key: API_PORT
    value: "8000"

# ─── SERVICES ──────────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # TRADING ENGINE (FastAPI + Trading Bot)
  # Unified service running both API and trading loop
  # ═══════════════════════════════════════════════════════════════════════════
  - name: trading-engine
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_size_slug: basic-xxs  # $5/mo - upgrade as needed
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: CORS_ALLOW_ALL
        scope: RUN_TIME
        value: "true"
      - key: XAI_API_KEY
        scope: RUN_TIME
        type: SECRET
    routes:
      - path: /api
      - path: /ws
      - path: /docs
      - path: /health
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js)
  # ═══════════════════════════════════════════════════════════════════════════
  - name: frontend
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
      deploy_on_push: true
    source_dir: frontend
    dockerfile_path: frontend/Dockerfile
    http_port: 3000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /
    envs:
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        value: ${APP_URL}/api
      - key: NEXT_PUBLIC_WS_URL
        scope: RUN_AND_BUILD_TIME
        value: wss://${APP_DOMAIN}/ws/equity

# ─── DATABASES ─────────────────────────────────────────────────────────────────
# References existing managed PostgreSQL cluster

databases:
  - name: db
    engine: PG
    cluster_name: i-need-a-dollar
    production: true

# ─── JOBS (Pre-deploy tasks) ──────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE MIGRATIONS
  # Runs before services start on each deployment
  # Tracks applied migrations in schema_migrations table
  # ═══════════════════════════════════════════════════════════════════════════
  - name: migrate
    github:
      repo: The-Nexus-Collective/I-Need-A-Dollar
      branch: main
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: basic-xxs
    kind: PRE_DEPLOY
    run_command: python migrations/run_migrations.py
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
