# ═══════════════════════════════════════════════════════════════════════════════
# STOCK PORTFOLIO MANAGER - SPRING BOOT ARCHITECTURE
# - PostgreSQL (Database with Liquibase migrations)
# - Backend (Spring Boot - API + Trading Engine)
# - Frontend (Next.js Dashboard)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE
  # ═══════════════════════════════════════════════════════════════════════════
  
  postgres:
    image: pgvector/pgvector:pg15
    container_name: inad_stock_db
    environment:
      POSTGRES_DB: trading_stock
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_stock_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_stock"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND (Spring Boot)
  # Stock Portfolio Manager with Yahoo Finance Integration
  # ═══════════════════════════════════════════════════════════════════════════

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inad_stock_backend
    environment:
      # Database
      - DATABASE_URL=jdbc:postgresql://postgres:5432/trading_stock
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      # Trading Configuration
      - MODE=${MODE:-paper}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # Cycle Configuration
      - CYCLE_INTERVAL=${CYCLE_INTERVAL:-600000}
      - STARTING_CAPITAL=${STARTING_CAPITAL:-100000}
      - POSITION_SIZE_PCT=${POSITION_SIZE_PCT:-0.02}
      - MAX_POSITIONS=${MAX_POSITIONS:-50}
      - MIN_DEPLOYMENT_RATIO=${MIN_DEPLOYMENT_RATIO:-0.75}
      - MAX_DEPLOYMENT_RATIO=${MAX_DEPLOYMENT_RATIO:-0.90}
      # Server
      - API_PORT=8081
      - CORS_ALLOW_ALL=true
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js Dashboard)
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inad_stock_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
      - NEXT_PUBLIC_WS_URL=ws://localhost:8081/ws/equity
    ports:
      - "3100:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MONITORING (Optional - activate with: docker compose --profile monitoring up)
  # ═══════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: inad_stock_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_stock_data:/prometheus
    ports:
      - "9091:9090"
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: inad_stock_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_stock_data:/var/lib/grafana
    ports:
      - "3101:3000"
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_stock_data:
  prometheus_stock_data:
  grafana_stock_data:

networks:
  default:
    name: inad_stock_network
