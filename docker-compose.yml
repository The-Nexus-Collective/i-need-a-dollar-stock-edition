version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # DATA LAYER
  # ═══════════════════════════════════════════════════════════════════════════
  
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: trading_db
    environment:
      POSTGRES_DB: trading_platform
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/migrations/002_add_filter_columns.sql:/docker-entrypoint-initdb.d/02_filters.sql:ro
      - ./backend/migrations/003_account_state.sql:/docker-entrypoint-initdb.d/03_account.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # BACKEND SERVICES
  # ═══════════════════════════════════════════════════════════════════════════

  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_gateway
    environment:
      - DATABASE_URL=postgresql://trading_user:${DB_PASSWORD:-trading_secret_2024}@postgres:5432/trading_platform
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - XAI_API_KEY=${XAI_API_KEY}
      - MODE=${MODE:-paper}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  signal_engine:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_signals
    environment:
      - DATABASE_URL=postgresql://trading_user:${DB_PASSWORD:-trading_secret_2024}@postgres:5432/trading_platform
      - REDIS_URL=redis://redis:6379
      - XAI_API_KEY=${XAI_API_KEY}
      - MODE=${MODE:-paper}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m core.signal_engine
    restart: unless-stopped

  risk_manager:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_risk
    environment:
      - DATABASE_URL=postgresql://trading_user:${DB_PASSWORD:-trading_secret_2024}@postgres:5432/trading_platform
      - REDIS_URL=redis://redis:6379
      - MODE=${MODE:-paper}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python -m core.risk_manager
    restart: unless-stopped

  # Trading bot - main strategy orchestrator
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_bot
    environment:
      - DATABASE_URL=postgresql://trading_user:${DB_PASSWORD:-trading_secret_2024}@postgres:5432/trading_platform
      - REDIS_URL=redis://redis:6379
      - XAI_API_KEY=${XAI_API_KEY}
      - MODE=${MODE:-paper}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-65}
      - VOLUME_FILTER_RATIO=${VOLUME_FILTER_RATIO:-0.80}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.02}
      - INITIAL_EQUITY=${INITIAL_EQUITY:-10000}
      - FLATTEN_TIME_CET=${FLATTEN_TIME_CET:-23:55}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python bot.py
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # DASHBOARD
  # ═══════════════════════════════════════════════════════════════════════════

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: trading_dashboard
    environment:
      - DATABASE_URL=postgresql://trading_user:${DB_PASSWORD:-trading_secret_2024}@postgres:5432/trading_platform
      - MODE=${MODE:-paper}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dashboard.py:/app/dashboard.py
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND (Next.js - Optional)
  # ═══════════════════════════════════════════════════════════════════════════

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - gateway
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════════════════════
  # MONITORING (Optional)
  # ═══════════════════════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: trading_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    profiles:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: trading_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: trading_network